<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>城市能源公开图表</title><style>body{font:18px sans-serif;margin:30px}select{font-size:18px}#tip{position:absolute;left:400px;top:100px;background:#fff;border:2px solid #345;padding:15px}iframe{width:650px;height:150px;border:1px solid #aaa}svg{display:block}button,a{margin:12px}</style><h1>城市能源公开图表</h1><select id="city"><option value="C01">城甲</option><option value="C02">城乙</option></select><select id="year"><option>2024</option><option>2023</option></select><h2 id="title"></h2><div id="graph"></div><div id="tip" hidden></div><iframe id="note" title="统计口径"></iframe><a id="detail" target="_blank">打开工业明细</a><script>
async function draw(){let c=document.querySelector('#city').value,y=document.querySelector('#year').value;document.querySelector('#title').textContent=c+' 年度 '+y;document.querySelector('#tip').hidden=true;await new Promise(r=>setTimeout(r,y==='2024'?120:220));let v=await(await fetch('/chart?city='+c+'&year='+y)).json();let ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');svg.setAttribute('width',650);svg.setAttribute('height',280);svg.dataset.revision=v.revision;svg.setAttribute('aria-label','图层 '+v.city+' '+v.year+' '+v.scope);v.points.forEach((d,i)=>{let x=80+i*180,cy=d.value===null?220:220-d.value*4;let circle=document.createElementNS(ns,'circle');circle.setAttribute('cx',x);circle.setAttribute('cy',cy);circle.setAttribute('r',12);circle.setAttribute('fill',d.value===null?'white':'#267');circle.setAttribute('stroke','#267');circle.onmouseenter=()=>{let tip=document.querySelector('#tip');tip.hidden=false;tip.textContent=v.city+' '+v.year+' '+d.sector+' '+(d.value===null?'缺报':d.value)+' '+v.unit+' '+d.meaning+' '+v.scope};circle.onmouseleave=()=>document.querySelector('#tip').hidden=true;let text=document.createElementNS(ns,'text');text.setAttribute('x',x-25);text.setAttribute('y',260);text.textContent=d.sector;svg.append(circle,text)});document.querySelector('#graph').replaceChildren(svg);await new Promise(r=>setTimeout(r,100));document.querySelector('#note').src='/note?city='+c+'&year='+y;document.querySelector('#detail').href='/detail?city='+c+'&year='+y;}
document.querySelector('#city').onchange=draw;document.querySelector('#year').onchange=draw;draw();</script></html>
